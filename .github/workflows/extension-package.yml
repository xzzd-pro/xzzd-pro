name: Package Extension

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome package
        run: pnpm exec plasmo build --target=chrome-mv3 --tag=prod --zip

      - name: Build Firefox package
        run: pnpm exec plasmo build --target=firefox-mv3 --tag=prod --zip

      - name: Inject Firefox addon id
        run: pnpm run fix:firefox:addon-id

      - name: Prepare packages
        id: meta
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/chrome artifacts/firefox
          unzip -q build/chrome-mv3-prod.zip -d artifacts/chrome/
          unzip -q build/firefox-mv3-prod.zip -d artifacts/firefox/

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: xzzd-pro-chrome-${{ steps.meta.outputs.version }}
          path: artifacts/chrome/*
          if-no-files-found: error

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: xzzd-pro-firefox-${{ steps.meta.outputs.version }}
          path: artifacts/firefox/*
          if-no-files-found: error
